<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganpati Bappa Morya</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(251, 220, 142);
        }
        .container1{
            width: 600px;
            height: 400px;
            margin: 100px auto;
            position: relative;
            /* border: 1px solid red; */
        }
        .whiteBox{
            height: 400px;
            width: 400px;
            background-color: rgb(72, 244, 112);
            position: absolute;
            left: 100px;
        }
        .firstImg{
            position: absolute;
            top:-50px;
            right:70px
        }
        .firstImg img{
            height: 250px;
            width: 250px;
        }
        .secondImage{
            position: absolute;
            bottom: -50px;
            left: 70px;
        }
        .secondImage img{
               height: 250px;
            width: 250px;
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="whiteBox"></div>
        <div class="firstImg">
            <img src="./Assets/Bappa 2.jpg" alt="">
        </div>
        <div class="secondImage">
            <img src="./Assets/images.jpg" alt="">
        </div>
    </div>





</body>
</html>
