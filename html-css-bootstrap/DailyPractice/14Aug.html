<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️secrete mission form</title>
</head>
<body>
    
  <h1>🕵️ secrete mission form</h1>  

  <form>

    <label>agent name</label>
    <input type="text" name="agentname" placeholder="enter agent name">
    <br> <br>

    <label>Mission Type:</label>
    <select name="mission type">
        <option>rescue</option>
        <option>investigation</option>
        <option>surveilance</option>
        <option>recovery</option>
    </select>
    <br><br>

    <label>priority:</label>
    <select name="priority">
        <option>low</option>
        <option>medium</option>
        <option>high</option>
        <opton>critical</opton>
    </select>
    <br><br>

    <label>location:</label>
    <input type="text" name="location" placeholder="enter mission location">
    <br><br>


    <label>equipment:</label>
    <br>

    <input type="checkbox" name="equipment" value="radio">
    <label>radio</label>
    <br>

    <input type="checkbox" name="equipment" value="camera">
    <label>camera</label>
    <br>

    <input type="checkbox" name="equipment" value="map">
    <label>map</label>
    <br>

    <input type="checkbox" name="equipment" value="firstaid">
    <label>first aid</label>
    <br>

    <label>mission instructon </label>
    <br>

    <textarea
    name="instuctions"
    rows="6"
    cols="40"
    placeholder="enter mission instruction">
    </textarea>

    <br><br>

    <input type="submit" value="accept mission">

  </form>
  
</body>
</html>
